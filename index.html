<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Glades Middle</title>
  <style>
    /* Global Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }

    /* Top Bar Container */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1a1a1a;
      background-image: radial-gradient(#333 10%, transparent 11%);
      background-size: 10px 10px; /* Optional halftone pattern effect */
      color: #ffffff;
      padding: 12px 30px;
      border-bottom: 1px solid #2a2a2a;
    }

    /* Left Side: Logo & School Title */
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .site-logo {
      height: 32px;
      width: auto;
    }

    .site-title {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    /* Right Side: Navigation Links & Controls */
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-link, .dropdown-btn {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 2px;
      transition: background-color 0.2s ease;
    }

    .nav-link:hover, .dropdown-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }

    /* Active Page Indicator */
    .nav-link.active {
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* Dropdown Component */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-btn {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .arrow {
      font-size: 0.65rem;
    }

    /* White Floating Menu Box */
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #f4f4f4;
      min-width: 190px;
      box-shadow: 0px 6px 16px rgba(0, 0, 0, 0.35);
      padding: 6px 0;
      border-radius: 2px;
      z-index: 1000;
    }

    .dropdown-content a {
      color: #222222;
      padding: 10px 16px;
      text-decoration: none;
      display: block;
      font-size: 0.88rem;
      text-align: center;
      font-weight: 500;
      transition: background-color 0.15s ease;
    }

    .dropdown-content a:hover {
      background-color: #e2e2e2;
    }

    /* Show dropdown on hover */
    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Search Button Icon */
    .search-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-btn:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <img src="logo.png" alt="Golden Glades Middle Logo" class="site-logo">
      <span class="site-title">Golden Glades Middle</span>
    </div>
    
    <nav class="topbar-right">
      <a href="index.html" class="nav-link active">Home</a>
      
      <div class="dropdown">
        <button class="dropdown-btn">About <span class="arrow">∨</span></button>
        <div class="dropdown-content">
          <a href="#">Administrative Team</a>
          <a href="#">Mission and Vision</a>
          <a href="#">Director's Message</a>
          <a href="#">Block Schedule</a>
          <a href="#">Staff Handbook</a>
        </div>
      </div>
      
      <a href="#" class="nav-link">Staff Directory</a>
      <a href="#" class="nav-link">Careers</a>
      <a href="#" class="nav-link">Contact Us</a>
      <button class="search-btn" aria-label="Search">🔍</button>
    </nav>
  </header>

</body>
</html>
